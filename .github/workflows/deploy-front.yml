name: Deploy Frontend → AWS S3

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://fieldops-api-prod.eba-pxu6drgm.us-east-2.elasticbeanstalk.com

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy para S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.FRONT_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ secrets.FRONT_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          echo "✅ Frontend publicado!"

      - name: Configurar S3 para hosting estático
        run: |
          aws s3 website s3://${{ secrets.FRONT_BUCKET }} \
            --index-document index.html \
            --error-document index.html
